<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShockBag · HAL Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0b0f; --card:#15161e; --line:#2a2c3a;
    --tx:#f4f4f7; --mut:#9a9bb0;
    --blue:#5b9dff; --green:#46d39a; --violet:#b07bff; --orange:#ff9a62; --red:#ff6b6b;
  }
  html,body{background:var(--bg);color:var(--tx)}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:28px;min-height:100vh;font-size:16px;line-height:1.4;max-width:1200px;margin:0 auto}
  header{margin-bottom:26px}
  header h1{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff}
  header p{font-size:16px;color:var(--mut);margin-top:6px}
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px}
  .card.hot{border-color:rgba(70,211,154,.45);background:linear-gradient(180deg,rgba(70,211,154,.08),rgba(70,211,154,0))}
  .card .lbl{font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .card .val{font-size:clamp(40px,6vw,54px);font-weight:800;line-height:1.05;margin-top:10px;letter-spacing:-.02em}
  .card .sub{font-size:15px;color:var(--mut);margin-top:8px}
  .chip{display:inline-block;font-size:15px;font-weight:700;padding:3px 12px;border-radius:999px;margin-top:8px}
  .chip.up{background:rgba(70,211,154,.16);color:var(--green)}
  .chip.down{background:rgba(255,107,107,.16);color:var(--red)}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .box h2{font-size:18px;font-weight:700;margin-bottom:4px}
  .box .hint{font-size:14px;color:var(--mut);margin-bottom:16px}
  .two{grid-template-columns:1fr 1fr;margin-bottom:16px}
  .full{grid-template-columns:1fr;margin-bottom:16px}
  footer{color:var(--mut);font-size:14px;margin-top:8px;text-align:center;line-height:1.6}
  .err{background:rgba(255,107,107,.12);border:1px solid var(--red);color:#ffd2d2;padding:18px;border-radius:14px;font-size:16px}
  @media(max-width:780px){.two{grid-template-columns:1fr}body{padding:18px}}
</style>
</head>
<body>
<header>
  <h1>ShockBag · HAL</h1>
  <p id="ts">Cargando datos…</p>
</header>

<div id="content" style="display:none">
  <div class="grid cards" id="cards"></div>

  <div class="grid full">
    <div class="box">
      <h2>Actividad por día</h2>
      <div class="hint" id="dayHint">Consultas recibidas y pedidos de link de compra</div>
      <canvas id="cDay" height="90"></canvas>
    </div>
  </div>

  <div class="grid two">
    <div class="box">
      <h2>¿A qué hora escriben?</h2>
      <div class="hint" id="hourHint">Hora de Uruguay</div>
      <canvas id="cHour" height="200"></canvas>
    </div>
    <div class="box">
      <h2>Qué pregunta la gente</h2>
      <div class="hint">Lo más consultado (sin saludos)</div>
      <canvas id="cQ" height="200"></canvas>
    </div>
  </div>
</div>

<div id="errbox"></div>
<footer id="ft"></footer>

<script>
var C={blue:'#5b9dff',green:'#46d39a',violet:'#b07bff',orange:'#ff9a62',tx:'#f4f4f7',mut:'#9a9bb0',line:'#2a2c3a'};
Chart.defaults.color=C.mut;
Chart.defaults.font.size=14;
var ax={ticks:{color:C.mut,font:{size:13}},grid:{color:C.line}};
var charts=[];

function hh(h){return (h<10?'0'+h:h)+'h';}
function nf(n){return (n==null?0:n).toLocaleString('es-UY');}

function render(d){
  document.getElementById('content').style.display='';
  document.getElementById('errbox').innerHTML='';

  document.getElementById('ts').textContent='Actualizado: '+
    new Date(d.updatedAt).toLocaleString('es-UY',{timeZone:'America/Montevideo',
    weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' (hora UY)';

  var trendUp=d.weekTrendPct>=0;
  var trendChip='<span class="chip '+(trendUp?'up':'down')+'">'+(trendUp?'▲ +':'▼ ')+d.weekTrendPct+'% vs semana previa</span>';
  var buySub = d.linkCompra>0
    ? d.uniqueBuyers+' personas · '+d.linkRate+'% de las charlas'
    : 'se empieza a medir desde hoy';

  var cards=[
    {lbl:'Pidieron link de compra', val:nf(d.linkCompra), color:C.green, sub:buySub, hot:true},
    {lbl:'Consultas hoy', val:nf(d.today.consultas), color:C.blue, sub:d.today.links+' pidieron link hoy'},
    {lbl:'Esta semana', val:nf(d.last7), color:C.violet, sub:trendChip},
    {lbl:'Usuarios únicos', val:nf(d.uniqueUsers), color:C.orange, sub:'personas distintas que escribieron'},
    {lbl:'Consultas totales', val:nf(d.totalConsultas), color:'#fff', sub:'promedio '+d.avgPerDay+'/día'}
  ];
  document.getElementById('cards').innerHTML=cards.map(function(c){
    return '<div class="card'+(c.hot?' hot':'')+'"><div class="lbl">'+c.lbl+'</div>'
      +'<div class="val" style="color:'+c.color+'">'+c.val+'</div>'
      +'<div class="sub">'+c.sub+'</div></div>';
  }).join('');

  charts.forEach(function(c){c.destroy();});charts=[];

  charts.push(new Chart(document.getElementById('cDay'),{
    type:'line',
    data:{labels:d.perDay.map(function(x){return x.date.slice(5);}),
      datasets:[
        {label:'Consultas',data:d.perDay.map(function(x){return x.consultas;}),
         borderColor:C.blue,backgroundColor:C.blue+'26',fill:true,tension:.35,borderWidth:3,pointRadius:0,pointHoverRadius:5},
        {label:'Pidieron link',data:d.perDay.map(function(x){return x.links;}),
         borderColor:C.green,backgroundColor:'transparent',tension:.35,borderWidth:3,pointRadius:0,pointHoverRadius:5}
      ]},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:{labels:{color:C.mut,font:{size:14},usePointStyle:true,boxWidth:8}}},
      scales:{x:ax,y:Object.assign({beginAtZero:true},ax)}}
  }));
  var bd=d.busiestDay;
  document.getElementById('dayHint').textContent= bd
    ? 'Día más activo: '+bd.date.slice(5)+' con '+bd.consultas+' consultas'
    : 'Consultas recibidas y pedidos de link de compra';

  var peak=d.peakHours||[];
  charts.push(new Chart(document.getElementById('cHour'),{
    type:'bar',
    data:{labels:d.perHour.map(function(x){return hh(x.hour);}),
      datasets:[{data:d.perHour.map(function(x){return x.count;}),
        backgroundColor:d.perHour.map(function(x){return peak.indexOf(x.hour)>=0?C.violet:C.violet+'4d';}),
        borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},
      scales:{x:Object.assign({},ax,{ticks:{color:C.mut,font:{size:11},maxRotation:0,autoSkip:true,maxTicksLimit:12}}),y:Object.assign({beginAtZero:true},ax)}}
  }));
  document.getElementById('hourHint').textContent='Horas pico (UY): '+peak.map(hh).join(' · ');

  var q=(d.topQuestions||[]).slice(0,12);
  charts.push(new Chart(document.getElementById('cQ'),{
    type:'bar',
    data:{labels:q.map(function(x){return x.msg;}),
      datasets:[{data:q.map(function(x){return x.count;}),
        backgroundColor:C.orange+'cc',borderColor:C.orange,borderWidth:1,borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},
      scales:{x:Object.assign({beginAtZero:true},ax),y:{ticks:{color:C.tx,font:{size:14}},grid:{display:false}}}}
  }));

  document.getElementById('ft').innerHTML='“Pidieron link de compra” se registra desde el 19/06/2026 (lo anterior no se medía). Se excluyen cuentas de prueba (brune.ssj, bruneesilva). Hora de Uruguay · se actualiza solo cada 5 min.';
}

function load(){
  fetch('/api/stats',{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(e){
    console.error(e);
    document.getElementById('content').style.display='none';
    document.getElementById('ts').textContent='No se pudieron cargar los datos.';
    document.getElementById('errbox').innerHTML='<div class="err">No se pudieron cargar los datos. Revisar que el workflow “ShockBag Stats API” esté activo en n8n.</div>';
  });
}
load();
setInterval(load,300000);
</script>
</body>
</html>
