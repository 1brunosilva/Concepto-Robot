<head>

<title>Concepto Development</title>

<style>
/* ═══════════════════════════════════════════════════════
   CONCEPTO DEVELOPMENT — MOBILE VIDEO SCRUBBER HERO
   Integración: reemplaza #s-hero en mobile (≤680px)
   Desktop: Three.js GLB sigue intacto
   ═══════════════════════════════════════════════════════ */

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#f0ede8;
  --ink:#0d0d0d;
  --mid:#585858;
  --dim:#a0a0a0;
  --vlt:#7c3aed;
  --vlt-l:#a855f7;
  --night:#06040f;
}
html,body{
  background:var(--cream);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ══════════════════════════════════════
   MOBILE ONLY — video scrubber hero
   ══════════════════════════════════════ */
@media(max-width:680px){

  /* La sección hero mobile ocupa 200vh —
     100vh visible + 100vh de scroll para
     animar los 10 segundos de video total */
  #cd-hero-mobile{
    position:relative;
    height:200vh;
    /* ocultar en desktop */
  }

  /* Canvas fijo que muestra el video */
  #cd-hero-sticky{
    position:sticky;
    top:0;
    height:100svh;
    width:100%;
    overflow:hidden;
    background:var(--cream);
  }

  /* Video elements — hidden, solo para scrubbing */
  #vid1,#vid2{
    position:absolute;
    width:1px;height:1px;
    opacity:0;pointer-events:none;
    /* preload silencioso */
  }

  /* Canvas donde dibujamos los frames */
  #cd-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    /* object-position: center top para mostrar
       el robot desde arriba hacia abajo */
    background:var(--cream);
  }

  /* Overlay copy — aparece al inicio, fade out al scrollear */
  #cd-copy{
    position:absolute;
    bottom:0;left:0;right:0;
    padding:0 7vw calc(10svh + 21px);
    display:flex;flex-direction:column;
    align-items:center;text-align:center;
    z-index:10;
    transition:opacity .3s ease;
    /* fondo gradiente para que el texto sea legible
       sobre el robot claro */
    background:linear-gradient(
      to top,
      rgba(240,237,232,.95) 0%,
      rgba(240,237,232,.7) 40%,
      transparent 100%
    );
    padding-top:3rem;
  }
  #cd-copy.hidden{
    opacity:0;
    pointer-events:none;
  }

  .cd-tag{
    font-size:9.5px;
    font-weight:400;
    letter-spacing:.18em;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:.9rem;
    font-family:'DM Mono',monospace;
  }
  .cd-h1{
    font-family:'Syne',sans-serif;
    font-size:clamp(30px,9.5vw,44px);
    font-weight:800;
    letter-spacing:-.04em;
    line-height:.9;
    color:var(--ink);
  }
  .cd-h1 .fade{color:var(--dim);}

  .cd-sub{
    font-size:13px;
    color:var(--mid);
    line-height:1.7;
    margin-top:.8rem;
    font-weight:300;
    max-width:260px;
  }

  .cd-btns{
    display:flex;gap:.45rem;
    margin-top:1.2rem;
    justify-content:center;
  }
  .cd-b1{
    padding:.55rem 1.3rem;
    border-radius:100px;
    background:var(--ink);
    color:var(--cream);
    font-size:12.5px;
    font-family:'Syne',sans-serif;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .cd-b2{
    padding:.55rem 1.3rem;
    border-radius:100px;
    border:1px solid rgba(13,13,13,.18);
    color:var(--ink);
    font-size:12.5px;
    font-family:'Syne',sans-serif;
  }

  /* Scroll hint */
  #cd-scroll-hint{
    position:absolute;
    bottom:24px;left:50%;
    transform:translateX(-50%);
    display:flex;flex-direction:column;
    align-items:center;gap:4px;
    z-index:11;
    transition:opacity .4s;
  }
  #cd-scroll-hint.hidden{opacity:0;}
  .cd-sh-text{
    font-size:9px;
    color:rgba(13,13,13,.35);
    letter-spacing:.12em;
    text-transform:uppercase;
    font-family:'DM Mono',monospace;
  }
  .cd-sh-arrow{
    width:18px;height:18px;
    border-right:1.5px solid rgba(13,13,13,.25);
    border-bottom:1.5px solid rgba(13,13,13,.25);
    transform:rotate(45deg);
    animation:cd-bounce 1.6s ease-in-out infinite;
  }
  @keyframes cd-bounce{
    0%,100%{transform:rotate(45deg) translateY(0);}
    50%{transform:rotate(45deg) translateY(4px);}
  }

  /* Loading state */
  #cd-loader{
    position:absolute;inset:0;
    background:var(--cream);
    display:flex;align-items:center;justify-content:center;
    z-index:20;
    transition:opacity .5s;
  }
  #cd-loader.hidden{opacity:0;pointer-events:none;}
  .cd-loader-inner{
    display:flex;flex-direction:column;
    align-items:center;gap:1.2rem;
  }
  .cd-loader-logo{
    font-family:'Syne',sans-serif;
    font-size:15px;font-weight:800;
    color:var(--ink);letter-spacing:-.03em;
  }
  .cd-loader-bar{
    width:80px;height:1px;
    background:rgba(13,13,13,.1);
    overflow:hidden;
  }
  .cd-loader-fill{
    height:100%;background:var(--ink);
    width:0%;
    transition:width .1s linear;
  }

  /* Scarcity bar push */
  body.has-scarcity #cd-hero-mobile{
    /* el nav y scarcity ya manejan el offset */
  }

  /* DESKTOP: ocultar el hero mobile */
}

/* Desktop: ocultar completamente el hero mobile */
@media(min-width:681px){
  #cd-hero-mobile{display:none;}
}

/* Mobile: ocultar el hero original */
@media(max-width:680px){
  #s-hero{display:none !important;}
}

/* ══════════════════════════════════════
   NAV overrides mobile
   ══════════════════════════════════════ */
@media(max-width:680px){
  nav{
    position:fixed;top:0;left:0;right:0;
    z-index:400;
    background:transparent;
    transition:background .4s, top .5s;
  }
  nav.scrolled{
    background:rgba(240,237,232,.88);

  /* cuando estamos en la night section (video2 avanzado) */
  nav.on-dark{

    color:#fff;
    background:rgba(168,85,247,.2);
    border:1px solid rgba(168,85,247,.3);
  }
}

<script>
/* ═══════════════════════════════════════════════════════
   CONCEPTO — MOBILE VIDEO SCRUBBER
   
   Lógica:
   - Solo activa en mobile (≤680px)
   - #cd-hero-mobile tiene height:200vh (scroll space)
   - sticky inner mantiene el canvas fijo
   - scroll 0→50% = video1 (5s, robot corriendo)
   - scroll 50→100% = video2 (5s, zoom portal)
   - copy fade out en scroll 0→15%
   - nav cambia a dark en scroll 85→100%
   ═══════════════════════════════════════════════════════ */

(function() {
  // Solo mobile
  if (window.innerWidth > 680) return;

  const vid1    = document.getElementById('vid1');
  const vid2    = document.getElementById('vid2');
  const canvas  = document.getElementById('cd-canvas');
  const ctx     = canvas.getContext('2d');
  const copy    = document.getElementById('cd-copy');
  const hint    = document.getElementById('cd-scroll-hint');
  const loader  = document.getElementById('cd-loader');
  const fill    = document.getElementById('cd-loader-fill');
  const navEl   = document.getElementById('nav');
  const hero    = document.getElementById('cd-hero-mobile');

  let v1Ready = false, v2Ready = false;
  let rafId = null;
  let lastDrawnTime = -1;
  let lastDrawnVid  = null;
  let isDrawing = false;

  // Resize canvas al tamaño de pantalla
  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas, { passive: true });

  // ── LOADER PROGRESS ──
  let loadCount = 0;
  function onVideoReady(which) {
    loadCount++;
    fill.style.width = (loadCount * 50) + '%';
    if (which === 1) v1Ready = true;
    if (which === 2) v2Ready = true;
    if (v1Ready && v2Ready) {
      setTimeout(() => {
        loader.classList.add('hidden');
        // Dibujá el primer frame de vid1
        drawFrame(vid1);
      }, 300);
    }
  }

  // Preload forzado — seek al inicio activa el decode
  function forcePreload(video, cb) {
    video.load();
    const onMeta = () => {
      video.removeEventListener('loadedmetadata', onMeta);
      // Seek a t=0 para forzar decode del primer frame
      video.currentTime = 0;
      video.addEventListener('seeked', function onSeeked() {
        video.removeEventListener('seeked', onSeeked);
        cb();
      }, { once: true });
    };
    video.addEventListener('loadedmetadata', onMeta);
    // Fallback timeout
    setTimeout(cb, 4000);
  }

  forcePreload(vid1, () => onVideoReady(1));
  forcePreload(vid2, () => onVideoReady(2));

  // ── DRAW FRAME ──
  function drawFrame(video) {
    if (isDrawing) return;
    isDrawing = true;
    try {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const vw = video.videoWidth  || canvas.width;
      const vh = video.videoHeight || canvas.height;
      const cw = canvas.width;
      const ch = canvas.height;

      // object-fit: cover centrado
      const scale = Math.max(cw / vw, ch / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const dx = (cw - dw) / 2;
      const dy = (ch - dh) / 2;

      ctx.drawImage(video, dx, dy, dw, dh);
    } catch(e) {}
    isDrawing = false;
  }

  // ── SCROLL HANDLER ──
  function onScroll() {
    if (!v1Ready && !v2Ready) return;

    const heroTop    = hero.offsetTop;
    const heroHeight = hero.offsetHeight; // 200vh
    const scrollY    = window.scrollY;
    const scrollable = heroHeight - window.innerHeight;

    // progreso total 0→1 dentro del hero
    const rawProgress = Math.max(0, Math.min(1,
      (scrollY - heroTop) / scrollable
    ));

    // ── Copy fade out (0→15% scroll) ──
    const copyOpacity = 1 - Math.min(1, rawProgress / 0.15);
    copy.style.opacity = copyOpacity;
    if (copyOpacity < 0.05) copy.classList.add('hidden');
    else copy.classList.remove('hidden');

    // ── Scroll hint ──
    if (rawProgress > 0.03) hint.classList.add('hidden');
    else hint.classList.remove('hidden');

    // ── Nav color ──
    if (rawProgress > 0.82) {
      navEl.classList.add('on-dark');
      navEl.classList.remove('scrolled');
    } else if (rawProgress > 0.02) {
      navEl.classList.add('scrolled');
      navEl.classList.remove('on-dark');
    } else {
      navEl.classList.remove('scrolled', 'on-dark');
    }

    // ── Video scrubbing ──
    // 0→0.5 = vid1 (5s), 0.5→1.0 = vid2 (5s)
    let targetVid, targetTime;

    if (rawProgress <= 0.5) {
      targetVid  = vid1;
      targetTime = (rawProgress / 0.5) * (vid1.duration || 5);
    } else {
      targetVid  = vid2;
      targetTime = ((rawProgress - 0.5) / 0.5) * (vid2.duration || 5);
    }

    targetTime = Math.max(0, Math.min(
      targetVid.duration || 5,
      targetTime
    ));

    // Solo seekamos si cambió significativamente (>40ms)
    const timeDiff = Math.abs(targetTime - (targetVid.currentTime || 0));
    const vidChanged = targetVid !== lastDrawnVid;

    if (timeDiff > 0.04 || vidChanged) {
      targetVid.currentTime = targetTime;
      lastDrawnVid = targetVid;
    }

    // Dibujamos siempre (el seek puede ser async)
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => drawFrame(targetVid));
  }

  // Escuchamos seeked para redibujar cuando el frame esté listo
  function onSeeked() { drawFrame(this); }
  vid1.addEventListener('seeked', onSeeked);
  vid2.addEventListener('seeked', onSeeked);

  window.addEventListener('scroll', onScroll, { passive: true });

  // Init
  onScroll();

})();
</script>
